[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "fincomplaint-ai"
version = "0.1.0"
description = "Phase-driven baseline for complaint triage workflow."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.40.0",
  "pandas>=2.2.0",
  "pydantic>=2.8.0",
  "pyarrow>=16.0.0",
  "python-dotenv>=1.0.1",
  "pytest>=8.2.0",
  "ruff>=0.5.0",
  "mypy>=1.10.0",
  "streamlit>=1.35.0",
  "langgraph>=0.2.0",
  "langchain-core>=0.3.0",
  "groq>=1.1.2",
  "dotenv>=0.9.9",
  "numpy==1.26.4",
  "huggingface-hub>=1.10.1",
  "chromadb>=0.5.0",
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
]

[tool.uv]
# chromadb pulls onnxruntime; 1.24+ lacks wheels for older macOS x86_64 — pin for broader dev machines.
override-dependencies = ["onnxruntime==1.17.3"]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = []

[tool.mypy]
python_version = "3.11"
files = ["src"]
warn_unused_configs = true
check_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
