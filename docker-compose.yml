# ──────────────────────────────────────────────────────────────────────────────
# FinComplaint AI — Full-stack Docker Compose
#
# Normal startup:
#   docker compose up --build
#
# One-time migration (copy local Docker MongoDB → Atlas):
#   docker compose up mongodb
#   docker compose run --rm migrate
#
# Admin credentials (first run only):
#   Email:    admin@fincomplaint.ai
#   Password: Admin1234!
# ──────────────────────────────────────────────────────────────────────────────

services:

  # ── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Local MongoDB (holds existing data in mongo_data volume) ───────────────
  mongodb:
    image: mongo:7
    command: mongod --quiet --logpath /dev/null
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5

  # ── One-shot migration: local MongoDB → Atlas ──────────────────────────────
  # Run once:  docker compose run --rm migrate
  migrate:
    image: python:3.11-slim
    depends_on:
      mongodb:
        condition: service_healthy
    env_file:
      - ./.env
    environment:
      - LOCAL_MONGODB_URL=mongodb://mongodb:27017
    volumes:
      - ./scripts/migrate_to_atlas.py:/migrate.py:ro
    command: >
      sh -c "pip install motor pymongo --quiet &&
             python /migrate.py"
    restart: "no"
    profiles:
      - migrate

  # ── Admin seeder (runs once on first startup) ──────────────────────────────
  mongo-seed:
    image: python:3.11-slim
    env_file:
      - ./.env
    volumes:
      - ./scripts/seed_admin.py:/seed_admin.py:ro
    command: >
      sh -c "pip install motor bcrypt --quiet &&
             python /seed_admin.py"
    restart: "no"

  # ── FastAPI Backend + LangGraph AI Pipeline ────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: web_application/Dockerfile.backend
    ports:
      - "8000:8000"
    env_file:
      - ./.env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - APP_ENV=production
      - DATA_DIR=/app/data
      - CHROMA_DIR=/app/chroma_db
      - LEGAL_MCP_USE_MOCK_FALLBACK=${LEGAL_MCP_USE_MOCK_FALLBACK:-1}
    volumes:
      - ./data:/app/data:ro
      - ./chroma_db:/app/chroma_db
      - ./logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
      mongo-seed:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; r=urllib.request.urlopen('http://localhost:8000/health',timeout=4); sys.exit(0 if r.status==200 else 1)"]
      interval: 15s
      timeout: 8s
      start_period: 40s
      retries: 5

  # ── Next.js Frontend ───────────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: web_application/Dockerfile.frontend
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:8000
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 20s
      timeout: 8s
      start_period: 30s
      retries: 3

volumes:
  redis_data:
  mongo_data:
